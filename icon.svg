<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Moneta">
  <!-- Moneta mark: a minted coin with an M monogram (Moneta, Roman goddess of the mint) -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14594A"/>
      <stop offset="1" stop-color="#0A3A30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7D3A4"/>
      <stop offset="0.55" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#A9874B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#field)"/>
  <!-- coin rim and milled inner ring -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#C9A96E" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="2 9"/>
  <!-- M monogram: one filled shape (crisp corners at every size) with fine serifs -->
  <g fill="#F6F1E6">
    <path d="M168 330 V184 H200 L256 262 L312 184 H344 V330 H314 V234 L256 314 L198 234 V330 Z"/>
    <rect x="152" y="324" width="62" height="9"/>
    <rect x="298" y="324" width="62" height="9"/>
    <rect x="156" y="184" width="44" height="8"/>
    <rect x="312" y="184" width="44" height="8"/>
  </g>
</svg>
